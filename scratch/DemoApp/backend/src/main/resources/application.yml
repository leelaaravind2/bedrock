# DemoApp backend configuration.
# All environment-specific values come from env vars (set by docker-compose),
# with localhost defaults so the app can also be run directly with Maven.

spring:
  application:
    name: DemoApp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demoapp}
    username: ${SPRING_DATASOURCE_USERNAME:demoapp}
    password: ${SPRING_DATASOURCE_PASSWORD:demoapp}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

# Default seed user for the simple-login auth. Override via env in production.
app:
  seed:
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
