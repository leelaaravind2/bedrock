# __PROJECT_NAME__ — Go + __DB_DISPLAY_NAME__.
# Run with:  docker compose up --build
#
# Standard Docker Compose project. It depends on nothing from Thraksha and runs
# unchanged after the generator is deleted (Laws 19-21).

services:
  db:
    image: __DB_IMAGE__
    environment:
      __DB_COMPOSE_DB_ENV__
    healthcheck:
      test: __DB_COMPOSE_HEALTHCHECK__
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:__DB_VOLUME_PATH__

  backend:
    build: .
    environment:
      PGHOST: db
      PGPORT: __DB_PORT__
      PGDATABASE: __DB_NAME__
      PGUSER: __DB_USER__
      PGPASSWORD: __DB_PASSWORD__
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
